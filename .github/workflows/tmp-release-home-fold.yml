name: Temporary release fold validation

on:
  push:
    branches:
      - feature/urdu-typing-practice

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/urdu-typing-practice
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Correct homepage desktop grid rhythm
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('css/modern-home.css')
          source = path.read_text()
          old = '''  .col-sm {\n    display: grid;\n    grid-template-columns: minmax(0, 1.15fr) minmax(300px, .85fr);\n    align-items: center;\n    gap: clamp(24px, 4vw, 56px);\n  }'''
          new = '''  .col-sm {\n    display: grid;\n    grid-template-columns: minmax(0, 1.15fr) minmax(300px, .85fr);\n    align-items: center;\n    column-gap: clamp(24px, 4vw, 56px);\n    row-gap: 8px;\n  }'''
          if old not in source:
              raise SystemExit('desktop homepage grid rule not found')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Validate production visual audit
        run: npx playwright test tests/v3-visual-quality.spec.js --project=desktop-chromium
      - name: Commit release polish
        run: |
          git config user.name "github-actions[bot]]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/modern-home.css
          if git diff --cached --quiet; then
            echo "No release polish changes to commit."
          else
            git commit -m "Keep homepage writer above laptop fold"
            git push origin HEAD:feature/urdu-typing-practice
          fi
