name: Quality checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Slice B branch
        uses: actions/checkout@v4
        with:
          ref: feat/wu-seo-crawl-001b

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Slice B static shell outputs
        run: npm run locale:generate && npm run shell:sync

      - name: Commit deterministic Slice B HTML
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/wu-seo-crawl-001b'
        run: |
          git config user.name "write-urdu-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html' 'tools/*.html' 'urdu/**/*.html'
          if git diff --cached --quiet; then
            echo "Generated HTML is already committed."
          else
            git commit -m "WU-SEO-CRAWL-001B: sync static source shells"
            git push origin HEAD:feat/wu-seo-crawl-001b
          fi

      - name: Upload Slice B generated HTML
        uses: actions/upload-artifact@v4
        with:
          name: slice-b-static-shell-${{ github.run_id }}
          path: |
            *.html
            tools/*.html
            urdu/**/*.html
          if-no-files-found: error
          retention-days: 2

      - name: Run static and transliteration contract tests
        run: npm test

      - name: Validate SEO files
        run: npm run seo:check

      - name: Validate routes and product governance
        run: npm run governance:check

      - name: Run InPage converter browser acceptance
        run: npx playwright test tests/inpage.spec.js

      - name: Run focused product browser acceptance
        run: npx playwright test tests/sua.spec.js tests/journey.spec.js tests/outcome-navigation.spec.js tests/workspace-next-step.spec.js tests/core-workspace-convergence.spec.js tests/capture-continuity.spec.js tests/create-publish-boundaries.spec.js tests/v2-creation.spec.js tests/seo-acquisition.spec.js tests/role-journeys.spec.js tests/sitemap-directory.spec.js tests/account-documents-editors.spec.js tests/voice-mobile-acceptance.spec.js tests/urdu-locale.spec.js

      - name: Run V3 production visual-quality audit
        run: npx playwright test tests/v3-visual-quality.spec.js --project=desktop-chromium

      - name: Upload V3 visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-visual-audit-${{ github.run_id }}
          path: visual-audit
          if-no-files-found: warn
          retention-days: 7
