name: Quality checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout 404 branch
        uses: actions/checkout@v4
        with:
          ref: fix/wu-production-404

      - name: Exclude 404 from public route registry governance
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-product-governance.js')
          source = path.read_text()
          old = "const htmlFiles = fs.readdirSync(root).filter(file => file.endsWith('.html') && !file.startsWith('google'));"
          new = "const htmlFiles = fs.readdirSync(root).filter(file => file.endsWith('.html') && !file.startsWith('google') && file !== '404.html');"
          if old not in source:
              raise SystemExit('Expected governance HTML discovery line was not found')
          path.write_text(source.replace(old, new, 1))
          PY
          git config user.name "write-urdu-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -- scripts/check-product-governance.js
          if git diff --cached --quiet; then
            echo "404 governance system-page exception is already current."
          else
            git commit -m "Exclude 404 from public route registry governance"
            git push origin HEAD:fix/wu-production-404
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate static source shell
        run: npm run shell:check

      - name: Validate static SEO graph
        run: npm run seo:graph:check

      - name: Validate static collection content
        run: npm run collections:check

      - name: Run static and transliteration contract tests
        run: npm test

      - name: Validate SEO files
        run: npm run seo:check

      - name: Validate routes and product governance
        run: npm run governance:check

      - name: Run InPage converter browser acceptance
        run: npx playwright test tests/inpage.spec.js

      - name: Run focused product browser acceptance
        run: npx playwright test tests/sua.spec.js tests/journey.spec.js tests/outcome-navigation.spec.js tests/workspace-next-step.spec.js tests/core-workspace-convergence.spec.js tests/capture-continuity.spec.js tests/create-publish-boundaries.spec.js tests/v2-creation.spec.js tests/seo-acquisition.spec.js tests/role-journeys.spec.js tests/sitemap-directory.spec.js tests/account-documents-editors.spec.js tests/voice-mobile-acceptance.spec.js tests/urdu-locale.spec.js

      - name: Run V3 production visual-quality audit
        run: npx playwright test tests/v3-visual-quality.spec.js --project=desktop-chromium

      - name: Upload V3 visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-visual-audit-${{ github.run_id }}
          path: visual-audit
          if-no-files-found: warn
          retention-days: 7
