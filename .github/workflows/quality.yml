name: Quality checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate static source shell
        run: npm run shell:check

      - name: Validate static SEO graph
        run: npm run seo:graph:check

      - name: Validate static collection content
        run: npm run collections:check

      - name: Run static and transliteration contract tests
        run: npm test

      - name: Validate SEO files
        run: npm run seo:check

      - name: Validate routes and product governance
        run: npm run governance:check

      - name: Run InPage converter browser acceptance
        run: npx playwright test tests/inpage.spec.js

      - name: Run focused product browser acceptance
        run: >-
          npx playwright test
          tests/sua.spec.js
          tests/journey.spec.js
          tests/continuation-telemetry-honesty.spec.js
          tests/first-use-telemetry-integrity.spec.js
          tests/mobile-editor-activation.spec.js
          tests/home-first-paint-stability.spec.js
          tests/outcome-navigation.spec.js
          tests/rich-editor-mobile-activation.spec.js
          tests/workspace-next-step.spec.js
          tests/core-workspace-convergence.spec.js
          tests/capture-continuity.spec.js
          tests/create-publish-boundaries.spec.js
          tests/v2-creation.spec.js
          tests/card-gallery.spec.js
          tests/urdu-cards.spec.js
          tests/urdu-cards-own-words.spec.js
          tests/urdu-cards-social-formats.spec.js
          tests/home-featured-card.spec.js
          tests/card-studio-background-collection.spec.js
          tests/wedding-invitation-render-adapter.spec.js
          tests/whatsapp-status-discovery.spec.js
          tests/seo-acquisition.spec.js
          tests/roman-urdu-converter.spec.js
          tests/urdu-keyboard-reference.spec.js
          tests/role-journeys.spec.js
          tests/sitemap-directory.spec.js
          tests/account-documents-editors.spec.js
          tests/voice-mobile-acceptance.spec.js
          tests/writer-voice-input.spec.js
          tests/urdu-locale.spec.js
          tests/urdu-wedding-invitation-maker.spec.js
          tests/page-integrity.spec.js
          tests/transliteration-availability.spec.js
          tests/basic-writer-workspace-integrity.spec.js
          tests/card-poetry-quality.spec.js
          tests/card-bidi-render.spec.js
          tests/card-studio-feedback.spec.js
          tests/card-studio-recent.spec.js
          tests/card-attribution-quality.spec.js
          tests/print-quality-pdf.spec.js
          tests/bill-urdu-input.spec.js
          tests/bill-completeness.spec.js
          tests/bill-generator-v2.spec.js
          tests/invoice-generator.spec.js
          tests/typing-practice-learning.spec.js
          tests/docx-export.spec.js
          tests/draft-restore-position.spec.js

      - name: Run V3 production visual-quality audit
        run: npx playwright test tests/v3-visual-quality.spec.js --project=desktop-chromium

      - name: Upload V3 audit metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-visual-metrics-${{ github.run_id }}
          path: visual-audit/report.json
          if-no-files-found: warn
          retention-days: 2

      # Keep the full screenshot set for failures and explicitly requested visual reviews.
      # A successful automatic PR/push run needs only the small audit metrics.
      - name: Upload V3 screenshot gallery
        if: ${{ failure() || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: v3-visual-screenshots-${{ github.run_id }}
          path: visual-audit/*.png
          if-no-files-found: warn
          retention-days: 2
