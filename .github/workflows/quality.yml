name: Quality checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static and transliteration contract tests
        run: npm test

      - name: Validate SEO files
        run: npm run seo:check

      - name: Validate routes and product governance
        run: npm run governance:check

      - name: Run focused product browser acceptance
        run: npx playwright test tests/sua.spec.js tests/journey.spec.js tests/v2-creation.spec.js tests/seo-acquisition.spec.js tests/role-journeys.spec.js tests/sitemap-directory.spec.js tests/inpage.spec.js

      - name: Run V3 production visual-quality audit
        run: npx playwright test tests/v3-visual-quality.spec.js --project=desktop-chromium

      - name: Upload V3 visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-visual-audit-${{ github.run_id }}
          path: visual-audit
          if-no-files-found: warn
          retention-days: 7
