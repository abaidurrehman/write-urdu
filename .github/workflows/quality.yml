name: Quality checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@v4
        with:
          ref: chore/wu-seo-crawl-001-closeout

      - name: Align share privacy contract wording
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/wu-seo-crawl-001-closeout'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/share-loop-contract.test.js')
          source = path.read_text()
          old = "assert.match(privacy, /Clearing browser\\/site storage may remove that self-service management token and does not, by itself, delete/, 'Privacy policy must explain local-token deletion semantics');"
          new = "assert.match(privacy, /private deletion key/, 'Privacy policy must explain private deletion access');\nassert.match(privacy, /Clearing browser\\/site storage may remove this self-service deletion access and does not, by itself, delete/, 'Privacy policy must explain local deletion-key semantics');"
          if old not in source:
              raise SystemExit('Expected legacy share privacy assertion was not found')
          path.write_text(source.replace(old, new, 1))
          PY
          git config user.name "write-urdu-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -- tests/share-loop-contract.test.js
          if git diff --cached --quiet; then
            echo "Share privacy contract is already current."
          else
            git commit -m "WU-SEO-CRAWL-001: align share privacy contract wording"
            git push origin HEAD:chore/wu-seo-crawl-001-closeout
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate static source shell
        run: npm run shell:check

      - name: Validate static SEO graph
        run: npm run seo:graph:check

      - name: Validate static collection content
        run: npm run collections:check

      - name: Run static and transliteration contract tests
        run: npm test

      - name: Validate SEO files
        run: npm run seo:check

      - name: Validate routes and product governance
        run: npm run governance:check

      - name: Run InPage converter browser acceptance
        run: npx playwright test tests/inpage.spec.js

      - name: Run focused product browser acceptance
        run: npx playwright test tests/sua.spec.js tests/journey.spec.js tests/outcome-navigation.spec.js tests/workspace-next-step.spec.js tests/core-workspace-convergence.spec.js tests/capture-continuity.spec.js tests/create-publish-boundaries.spec.js tests/v2-creation.spec.js tests/seo-acquisition.spec.js tests/role-journeys.spec.js tests/sitemap-directory.spec.js tests/account-documents-editors.spec.js tests/voice-mobile-acceptance.spec.js tests/urdu-locale.spec.js

      - name: Run V3 production visual-quality audit
        run: npx playwright test tests/v3-visual-quality.spec.js --project=desktop-chromium

      - name: Upload V3 visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-visual-audit-${{ github.run_id }}
          path: visual-audit
          if-no-files-found: warn
          retention-days: 7
