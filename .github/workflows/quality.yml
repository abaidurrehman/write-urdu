name: Quality checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-slice-b:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/urdu-locale-slice-b'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      published: ${{ steps.state.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/urdu-locale-slice-b

      - name: Detect Slice B state
        id: state
        shell: bash
        run: |
          if [ -f scripts/check-urdu-locale-seo.js ] && grep -q 'href="https://write-urdu.com/urdu/"' urdu/index.html 2>/dev/null && ! grep -qi 'noindex' urdu/index.html 2>/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish validated Slice B bundle
        if: steps.state.outputs.published != 'true'
        shell: bash
        run: |
          cat > /tmp/slice-b-source.tar.gz.b64 <<'EOF'

EOF
          base64 -d /tmp/slice-b-source.tar.gz.b64 > /tmp/slice-b-source.tar.gz
          tar -xzf /tmp/slice-b-source.tar.gz -C .
          node scripts/generate-urdu-locale.js
          node scripts/generate-seo-files.js
          node scripts/generate-urdu-locale.js --check
          node scripts/check-urdu-locale-seo.js
          node scripts/check-seo.js
          node scripts/check-product-governance.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- locale/ur.js scripts/generate-urdu-locale.js scripts/generate-seo-files.js scripts/check-urdu-locale-seo.js package.json scripts/run-contract-tests.js tests/urdu-locale-seo-contract.test.js tests/urdu-locale-generated-contract.test.js scripts/check-product-governance.js scripts/check-seo.js index.html urdu-keyboard.html urdu-editor.html tools/urdu-voice-typing.html urdu-alphabet.html urdu-faq.html urdu-card-studio.html how-to-write-urdu-on-photo.html urdu/index.html urdu/urdu-keyboard.html urdu/urdu-editor.html urdu/tools/urdu-voice-typing.html urdu/urdu-alphabet.html urdu/urdu-faq.html urdu/urdu-card-studio.html urdu/how-to-write-urdu-on-photo.html sitemap.xml
          git diff --cached --check
          git commit -m "feat: launch Phase 1 Urdu search documents"
          git push origin HEAD:feature/urdu-locale-slice-b

  static-and-seo:
    needs: publish-slice-b
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'feature/urdu-locale-slice-b' || needs.publish-slice-b.outputs.published == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static and transliteration contract tests
        run: npm test

      - name: Validate SEO files
        run: npm run seo:check

      - name: Validate routes and product governance
        run: npm run governance:check

      - name: Run InPage converter browser acceptance
        run: npx playwright test tests/inpage.spec.js

      - name: Run focused product browser acceptance
        run: npx playwright test tests/sua.spec.js tests/journey.spec.js tests/outcome-navigation.spec.js tests/workspace-next-step.spec.js tests/core-workspace-convergence.spec.js tests/capture-continuity.spec.js tests/create-publish-boundaries.spec.js tests/v2-creation.spec.js tests/seo-acquisition.spec.js tests/role-journeys.spec.js tests/sitemap-directory.spec.js tests/account-documents-editors.spec.js tests/voice-mobile-acceptance.spec.js tests/urdu-locale.spec.js

      - name: Run V3 production visual-quality audit
        run: npx playwright test tests/v3-visual-quality.spec.js --project=desktop-chromium

      - name: Upload V3 visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-visual-audit-${{ github.run_id }}
          path: visual-audit
          if-no-files-found: warn
          retention-days: 7
