name: Locale repair helper

on:
  push:
    branches:
      - fix/urdu-editor-locale-sync

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/urdu-editor-locale-sync
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair locale catalogue and regenerate Urdu page
        run: node scripts/repair-urdu-editor-locale-sync.js

      - name: Commit generated repair
        shell: bash
        run: |
          if git diff --quiet -- locale/ur.js urdu/urdu-editor.html; then
            echo "Locale output is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add locale/ur.js urdu/urdu-editor.html
          git commit -m "fix(i18n): sync Urdu editor export toolbar"
          git push origin HEAD:fix/urdu-editor-locale-sync
