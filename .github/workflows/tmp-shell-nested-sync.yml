name: Temporary nested shell sync

on:
  push:
    branches:
      - feature/urdu-typing-practice

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/urdu-typing-practice
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate nested static shell files
        run: |
          npm run shell:sync
          npm run shell:check
      - name: Commit nested generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/*.html
          if git diff --cached --quiet; then
            echo "No nested shell changes to commit."
          else
            git commit -m "Sync nested tools navigation for typing practice"
            git push origin HEAD:feature/urdu-typing-practice
          fi
