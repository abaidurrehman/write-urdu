name: Apply perf quick-win rewrite

on:
  push:
    branches:
      - perf/lighthouse-quickwins-2

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/lighthouse-quickwins-2
          fetch-depth: 0

      - name: Apply bounded rewrite
        run: node scripts/_perf-quickwins-2-rewrite.js

      - name: Commit transformed files
        run: |
          if git diff --quiet; then
            echo "No rewrite required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html urdu/index.html urdu-editor.html urdu/urdu-editor.html js/site-runtime.js
          git commit -m "perf: lazy-load writer export dependencies"
          git push origin HEAD:perf/lighthouse-quickwins-2
