name: Apply Product Pulse Slice 1

on:
  push:
    branches:
      - feature/product-pulse-slice1-continuation-diagnostic

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[slice1-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply bounded Slice 1 patch
        run: node scripts/apply-product-pulse-slice1.js

      - name: Syntax checks for touched runtime
        run: |
          node --check functions/api/events.js
          node --check functions/api/internal/product-pulse.js
          node --check js/product-telemetry.js
          node --check js/workspace-handoff.js
          node --check js/core-continuity.js
          node --check js/card-studio-entry.js
          node --check js/card-studio-handoff-adapter.js
          node --check js/qr-handoff-adapter.js
          node --check js/qr-generator.js
          node --check js/product-pulse.js

      - name: Run Slice 1 focused contracts
        run: |
          node tests/product-pulse-slice1-contract.test.js
          node tests/product-pulse-contract.test.js
          node tests/product-pulse-slice0-contract.test.js
          node tests/product-telemetry-contract.test.js
          node tests/journey-handoffs-contract.test.js
          node tests/core-continuity-contract.test.js
          node tests/workspace-next-step-contract.test.js
          node tests/create-publish-boundaries-contract.test.js
          node tests/qr-generator-core.test.js

      - name: Record repository-wide baseline checks
        run: |
          set +e
          for command in "npm test" "npm run seo:check" "npm run locale:check" "npm run governance:check"; do
            echo "::group::$command"
            bash -lc "$command"
            status=$?
            echo "exit=$status"
            echo "::endgroup::"
          done
          set -e
          echo "Repository-wide checks are recorded for context; Slice 1 focused contracts are the scoped gate because existing unrelated baseline drift is already documented."

      - name: Commit validated implementation
        run: |
          rm -f .github/workflows/apply-product-pulse-slice1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Implement Product Pulse Slice 1 continuation diagnostics [slice1-applied]"
          git push origin HEAD:feature/product-pulse-slice1-continuation-diagnostic
