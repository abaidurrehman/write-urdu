name: Bump shell contracts v47

on:
  push:
    branches:
      - perf/lighthouse-quickwins-2

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/lighthouse-quickwins-2
          fetch-depth: 0

      - name: Update current shell contracts
        run: node scripts/_bump-shell-contracts-v47.js

      - name: Commit contract revisions
        run: |
          if git diff --quiet; then
            echo "No rewrite required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "test: advance shell revision contracts to v47"
          git push origin HEAD:perf/lighthouse-quickwins-2
