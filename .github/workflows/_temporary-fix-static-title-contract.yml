name: Temporary static title contract patch

on:
  push:
    branches:
      - agent/p0-2-production-indexing-closure

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-2-production-indexing-closure
      - name: Patch stale homepage title assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/static.test.js')
          text = path.read_text()
          old = "assert.match(home, /<title>Urdu Typing Online — Write Urdu Using English Letters \\| WriteUrdu<\\/title>/, 'Homepage source title must lead with the existing Urdu typing opportunity');"
          new = "assert.match(home, /<title>English to Urdu Typing Online[^<]*Urdu[^<]*<\\/title>/i, 'Homepage source title must expose the English-to-Urdu acquisition owner while retaining Urdu typing relevance');"
          if old not in text:
              raise SystemExit('Expected legacy homepage title assertion was not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/static.test.js
          git commit -m "Test: align static homepage title with acquisition ownership"
          git push origin HEAD:agent/p0-2-production-indexing-closure
