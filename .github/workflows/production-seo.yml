name: Production SEO verification

on:
  workflow_run:
    workflows:
      - Quality checks
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-seo-main
  cancel-in-progress: true

jobs:
  verify-production:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Cloudflare and verify production SEO
        env:
          CANONICAL_AUDIT_PATHS: /,/urdu-editor,/urdu-keyboard,/roman-urdu-transliteration,/write-urdu-documentation,/urdu-card-studio,/how-to-write-urdu-on-photo
        run: |
          set -u
          for attempt in 1 2 3 4 5 6; do
            echo "Production SEO attempt ${attempt}/6"
            if npm run seo:production && npm run seo:live; then
              echo "Production SEO verification passed."
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Production SEO verification did not converge after six attempts."
              exit 1
            fi
            sleep 45
          done
