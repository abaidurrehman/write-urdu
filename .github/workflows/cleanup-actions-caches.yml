name: Cleanup Actions caches

on:
  push:
    paths:
      - '.github/workflows/cleanup-actions-caches.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all Actions caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          deleted=0
          while IFS=$'\t' read -r id key ref size; do
            [ -n "${id:-}" ] || continue
            echo "Deleting cache $id ($key) on $ref, ${size} bytes"
            gh api --method DELETE "/repos/$GH_REPO/actions/caches/$id"
            deleted=$((deleted + 1))
          done < <(
            gh api --paginate "/repos/$GH_REPO/actions/caches?per_page=100" \
              --jq '.actions_caches[] | [.id, .key, .ref, .size_in_bytes] | @tsv'
          )

          echo "Deleted $deleted Actions cache(s)."
