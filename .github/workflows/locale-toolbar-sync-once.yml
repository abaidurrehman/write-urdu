name: One-shot Urdu editor locale toolbar sync

on:
  push:
    branches:
      - fix/urdu-editor-locale-toolbar-sync
    paths:
      - '.github/workflows/locale-toolbar-sync-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/urdu-editor-locale-toolbar-sync
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch only the stale Rich Editor locale literals
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'locale/ur.js';
          let source = fs.readFileSync(file, 'utf8');

          const literalsStart = source.indexOf('  literalReplacements: {');
          if (literalsStart < 0) throw new Error('literalReplacements block not found');
          const editorStart = source.indexOf("    '/urdu-editor': [", literalsStart);
          if (editorStart < 0) throw new Error('Rich Editor literal block not found');
          const editorEnd = source.indexOf('\n    ]', editorStart);
          if (editorEnd < 0) throw new Error('Rich Editor literal block end not found');

          let block = source.slice(editorStart, editorEnd);

          function replaceOnce(from, to, label) {
            const count = block.split(from).length - 1;
            if (count !== 1) throw new Error(`${label}: expected exactly one match, found ${count}`);
            block = block.replace(from, to);
          }

          const lines = block.split('\n');
          const exportLines = lines.filter(line => line.includes('Export</summary>') && line.includes('برآمد کریں</summary>'));
          if (exportLines.length !== 1) throw new Error(`retired Export dropdown literal: expected exactly one line, found ${exportLines.length}`);
          block = lines.filter(line => line !== exportLines[0]).join('\n');

          replaceOnce('> Word document', '> Word', 'Word button literal');
          replaceOnce('> PDF document', '> PDF', 'PDF button literal');
          replaceOnce('> PNG image', '> PNG', 'PNG button literal');
          replaceOnce('> SVG image', '> SVG', 'SVG button literal');

          source = source.slice(0, editorStart) + block + source.slice(editorEnd);
          fs.writeFileSync(file, source, 'utf8');
          NODE

      - name: Regenerate Urdu locale output
        run: node scripts/generate-urdu-locale.js

      - name: Enforce two-file repair scope
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'Changed after generation:\n%s\n' "${changed[*]}"
          expected=$(printf '%s\n' locale/ur.js urdu/urdu-editor.html | sort)
          actual=$(printf '%s\n' "${changed[@]}" | sort)
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected generated-file scope; refusing to commit.' >&2
            git diff --stat >&2
            exit 1
          fi

      - name: Validate generated locale and closeout contracts
        run: |
          node tests/urdu-locale-generated-contract.test.js
          node tests/urdu-locale-closeout-contract.test.js

      - name: Remove one-shot workflow and commit repair
        shell: bash
        run: |
          rm .github/workflows/locale-toolbar-sync-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add locale/ur.js urdu/urdu-editor.html .github/workflows/locale-toolbar-sync-once.yml
          git commit -m 'Fix Urdu Rich Editor locale toolbar drift'
          git push origin HEAD:fix/urdu-editor-locale-toolbar-sync
