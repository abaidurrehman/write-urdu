name: Laptop fold repair

on:
  push:
    branches:
      - fix/basic-writer-laptop-fold

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/basic-writer-laptop-fold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply medium-laptop task-first repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('css/v3-production-polish.css')
          text = path.read_text()
          needle = '''@media (max-width: 1280px) {
            body.wu-v2-shell:not(.content-page) .home-hero-meta {
              display: none;
            }

            body.wu-v2-shell:not(.content-page) .home-hero-actions {
              margin: 9px 0 12px;
            }
          }
          '''
          replacement = '''/* At medium laptop widths the real writer is already immediately below the
             hero. The CTA row repeats destinations that remain available through the
             writing workspace and was the last element pushing the textarea below the
             task-first fold. Keep it on wide desktop and phones; remove it only here. */
          @media (min-width: 768px) and (max-width: 1400px) {
            body.wu-v2-shell:not(.content-page) .home-hero-actions {
              display: none;
            }
          }

          @media (max-width: 1280px) {
            body.wu-v2-shell:not(.content-page) .home-hero-meta {
              display: none;
            }
          }
          '''
          if needle not in text:
              raise SystemExit('expected laptop block not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Run V3 visual-quality audit
        run: npx playwright test tests/v3-visual-quality.spec.js --project=desktop-chromium
      - name: Recheck Basic Writer activation
        run: npx playwright test tests/mobile-editor-activation.spec.js tests/core-workspace-convergence.spec.js
      - name: Run contract suite
        run: npm test
      - name: Keep final branch diff to production CSS only
        run: |
          rm .github/workflows/laptop-fold-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/v3-production-polish.css .github/workflows/laptop-fold-repair.yml
          git commit -m "Fix Basic Writer laptop first-screen visibility"
          git push origin HEAD:fix/basic-writer-laptop-fold
