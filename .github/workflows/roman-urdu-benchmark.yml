name: Roman Urdu benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/roman-urdu/fixtures.js'
      - 'scripts/roman-urdu-benchmark/**'
      - 'tests/roman-urdu-benchmark-contract.test.js'
      - '.github/workflows/roman-urdu-benchmark.yml'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate B3 structural candidate
        run: node tests/roman-urdu-benchmark-contract.test.js

      - name: Run baseline and B3 candidate
        run: |
          mkdir -p benchmark-results/roman-urdu
          node scripts/roman-urdu-benchmark/run.js \
            --delay 150 \
            --out benchmark-results/roman-urdu/WU-JOURNEY-001B-B3-baseline.json
          node scripts/roman-urdu-benchmark/run.js \
            --delay 150 \
            --candidate protected-tokens \
            --out benchmark-results/roman-urdu/WU-JOURNEY-001B-B3-protected-tokens.json
          node scripts/roman-urdu-benchmark/run.js \
            --delay 150 \
            --candidate protected-tokens \
            --out benchmark-results/roman-urdu/WU-JOURNEY-001B-B3-protected-tokens.md
          node scripts/roman-urdu-benchmark/compare.js \
            benchmark-results/roman-urdu/WU-JOURNEY-001B-B3-baseline.json \
            benchmark-results/roman-urdu/WU-JOURNEY-001B-B3-protected-tokens.json \
            benchmark-results/roman-urdu/WU-JOURNEY-001B-B3-delta.md

      - name: Print B3 delta
        if: always()
        run: |
          if [ -f benchmark-results/roman-urdu/WU-JOURNEY-001B-B3-delta.md ]; then
            cat benchmark-results/roman-urdu/WU-JOURNEY-001B-B3-delta.md
          fi

      - name: Upload B3 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wu-journey-001b-b3
          path: benchmark-results/roman-urdu/
          retention-days: 30
          if-no-files-found: error
