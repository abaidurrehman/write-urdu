name: Roman Urdu benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/roman-urdu/fixtures.js'
      - 'scripts/roman-urdu-benchmark/**'
      - '.github/workflows/roman-urdu-benchmark.yml'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run current-provider baseline
        run: |
          mkdir -p benchmark-results/roman-urdu
          node scripts/roman-urdu-benchmark/run.js \
            --delay 175 \
            --out benchmark-results/roman-urdu/WU-JOURNEY-001B-baseline.json
          node scripts/roman-urdu-benchmark/run.js \
            --delay 175 \
            --out benchmark-results/roman-urdu/WU-JOURNEY-001B-baseline.md

      - name: Print human-readable baseline
        if: always()
        run: |
          if [ -f benchmark-results/roman-urdu/WU-JOURNEY-001B-baseline.md ]; then
            cat benchmark-results/roman-urdu/WU-JOURNEY-001B-baseline.md
          fi

      - name: Upload baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wu-journey-001b-baseline
          path: benchmark-results/roman-urdu/
          retention-days: 30
          if-no-files-found: error
