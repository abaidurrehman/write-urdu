name: Temporary Stylish Urdu SEO slice

on:
  push:
    branches:
      - agent/p1-5-stylish-urdu-seo-acquisition

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-5-stylish-urdu-seo-acquisition

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply acquisition changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing replacement target in {path}: {old[:100]}')
              p.write_text(text.replace(old, new, 1))

          # 1) SEO registry: make Stylish Text an explicit acquisition route and add one informational guide.
          seo = Path('seo.config.js')
          text = seo.read_text()
          old = "{ id: 'stylish-urdu-text-generator', path: '/stylish-urdu-text-generator', legacyPaths: ['/stylish-urdu-text-generator.html', '/urdu-stylish-name-generator'], indexable: true, title: 'Stylish Urdu Text Generator – Urdu Name Styles Copy and Paste', description: 'Create stylish Urdu names and short phrases with copyable Unicode decorations, then open a real font-based name image in the browser.', h1: 'Stylish Urdu Text and Name Generator', section: 'tools', priority: .88, changefreq: 'monthly', lastmod: '2026-07-17', schema: ['WebApplication', 'FAQPage'] }"
          new = "{ id: 'stylish-urdu-text-generator', path: '/stylish-urdu-text-generator', legacyPaths: ['/stylish-urdu-text-generator.html', '/urdu-stylish-name-generator'], indexable: true, title: 'Stylish Urdu Text Generator – Urdu Name Styles Copy and Paste', searchTitle: 'Stylish Urdu Text Generator – Copy & Paste Urdu Name Styles | WriteUrdu', description: 'Create stylish Urdu names and short phrases with copyable Unicode decorations, then open a real font-based name image in the browser.', searchDescription: 'Generate 80 copyable stylish Urdu text and name styles. Filter Unicode decorations, copy a result, and use Name Art when exact Nastaliq or Naskh rendering matters.', h1: 'Stylish Urdu Text and Name Generator', section: 'tools', priority: .88, changefreq: 'monthly', lastmod: '2026-08-12', schema: ['WebApplication', 'FAQPage'] }"
          if old not in text:
              raise SystemExit('Missing Stylish SEO config entry')
          text = text.replace(old, new, 1)
          anchor = "        { id: 'how-to-write-urdu-on-photo', path: '/how-to-write-urdu-on-photo', indexable: true, title: 'How to Write Urdu Text or Poetry on a Photo Online', description: 'Learn how to write Urdu text, poetry or quotes on a photo online, choose readable Urdu fonts, use a local background and export the finished image.', h1: 'How to write Urdu text or poetry on a photo online', section: 'guides', priority: .78, changefreq: 'yearly', datePublished: '2026-08-12', lastmod: '2026-08-12', schema: ['Article'] }"
          guide = ",\n        { id: 'how-to-make-stylish-urdu-text', path: '/how-to-make-stylish-urdu-text', indexable: true, title: 'How to Make Stylish Urdu Text or Names for WhatsApp & Instagram', description: 'Learn how copyable Urdu text styles work, where Unicode decorations may vary, and when to use a rendered Nastaliq or Naskh name image instead.', h1: 'How to make stylish Urdu text or names for WhatsApp and Instagram', section: 'guides', priority: .76, changefreq: 'yearly', datePublished: '2026-08-12', lastmod: '2026-08-12', schema: ['Article'] }"
          if anchor not in text:
              raise SystemExit('Missing photo-guide SEO config anchor')
          text = text.replace(anchor, anchor + guide, 1)
          seo.write_text(text)

          # 2) Stylish page: preserve the workspace, replace only post-results acquisition/supporting content.
          stylish = Path('stylish-urdu-text-generator.html')
          html = stylish.read_text()
          start = html.index('        <section class="stylish-seo">')
          end = html.index('    </main>', start)
          support = '''        <div class="stylish-workspace-end" data-wu-ad-boundary="post-workspace" aria-hidden="true"></div>
        <section class="stylish-seo" aria-label="About stylish Urdu text">
            <section>
                <h2>Copyable stylish Urdu text, not a fake font promise</h2>
                <p>The generator keeps your Urdu letters as text and adds curated Unicode decorations around or between them. That means many results can be copied and pasted, but the app or phone where you paste the result still chooses the actual Urdu font. If you need the exact visual appearance of Nastaliq or Naskh, use <a href="/urdu-name-art-maker">Urdu Name Art Studio</a> and export an image instead.</p>
                <h2>What can you make?</h2>
                <ul>
                    <li><strong>Stylish Urdu names:</strong> decorate a short personal or profile name and copy the result.</li>
                    <li><strong>Short Urdu captions:</strong> add a light, royal, heart, Islamic, gaming or social decoration to a brief phrase.</li>
                    <li><strong>WhatsApp display text:</strong> try a copyable result in a status line, profile field or message, then simplify it if the destination rejects a symbol.</li>
                    <li><strong>Instagram bio or display text:</strong> copy a short result and check how the destination app renders the Urdu letters and surrounding symbols.</li>
                    <li><strong>Gaming/profile names:</strong> use the lighter decorative styles first because games and profile systems can impose their own character rules.</li>
                    <li><strong>Image-ready name art:</strong> send the chosen wording into Name Art when exact typography matters more than copy/paste.</li>
                </ul>
                <p><a href="/how-to-make-stylish-urdu-text">Read the practical guide to stylish Urdu text for WhatsApp and Instagram →</a></p>
            </section>
            <section>
                <h2>How it works</h2>
                <ol><li>Type Urdu directly, or choose Roman Urdu and press Space for word-by-word transliteration.</li><li>Paste a longer Roman Urdu passage and use the bulk conversion action when needed.</li><li>Choose a category and intensity, then copy, favourite, share or open a result in Name Art.</li></ol>
                <h2>Compatibility questions</h2>
                <details open><summary>Are these real Urdu fonts?</summary><p>The copyable results are Unicode text plus decorative characters. Your destination app controls the font used to draw the Urdu letters. For an exact Nastaliq/Naskh look, create a rendered image in Name Art.</p></details>
                <details><summary>Why does a style look different on another phone or app?</summary><p>Fonts, emoji sets and support for decorative Unicode characters differ between operating systems and apps. A symbol can look different, fall back to another glyph or be rejected by a destination field.</p></details>
                <details><summary>Is this a translator?</summary><p>No. Roman Urdu input is transliteration: it changes sounds into Urdu script. It does not translate English meaning. Direct mode keeps English and Urdu exactly as entered.</p></details>
                <details><summary>Will every style work in WhatsApp, Instagram or a game?</summary><p>No universal compatibility guarantee is possible. Copy the result into the destination and check it there. If the app rejects decorative characters, choose a simpler style or use an exported Name Art image where images are supported.</p></details>
                <details><summary>Are favourites uploaded?</summary><p>No. Text, favourites and recent inputs are stored only in this browser. The optional Roman Urdu suggestion service is described in the <a href="/write-urdu-privacy">privacy policy</a>.</p></details>
                <nav class="stylish-related" aria-label="Related tools"><h2>Related tools</h2><p><a href="/urdu-name-art-maker">Create an exact Urdu name image</a> · <a href="/urdu-card-studio">Design an Urdu card</a> · <a href="/urdu-templates">Browse templates</a></p></nav>
            </section>
        </section>
'''
