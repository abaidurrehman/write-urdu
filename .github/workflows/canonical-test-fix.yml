name: Canonical test fixture repair

on:
  push:
    branches:
      - agent/restore-www-canonical
    paths:
      - '.github/workflows/canonical-test-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/restore-www-canonical
          fetch-depth: 0

      - name: Restore generic QR normalization expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/static.test.js')
          s = p.read_text()
          old = "assert.strictEqual(qrCore.buildUrlPayload({ url: 'write-urdu.com' }).payload, 'https://www.write-urdu.com/', 'URL payload normalization failed');"
          new = "assert.strictEqual(qrCore.buildUrlPayload({ url: 'write-urdu.com' }).payload, 'https://write-urdu.com/', 'URL payload normalization failed');"
          if old not in s:
              raise SystemExit('Expected migrated QR fixture not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit repair and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/canonical-test-fix.yml
          git add tests/static.test.js .github/workflows/canonical-test-fix.yml
          git commit -m "test: keep QR URL normalization host-neutral"
          git push origin HEAD:agent/restore-www-canonical
