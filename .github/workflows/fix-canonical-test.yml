name: Canonical link test repair

on:
  push:
    branches:
      - agent/internal-canonical-link-cleanup
    paths:
      - '.github/workflows/fix-canonical-test.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/internal-canonical-link-cleanup
          fetch-depth: 0
      - name: Align legacy test with canonical link contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/static.test.js')
          s = p.read_text()
          old = 'assert.match(keyboard, /href="roman-urdu-transliteration\\.html"/, \'Urdu keyboard page is missing the Roman Urdu guide promo link\');'
          new = 'assert.match(keyboard, /href="\\/roman-urdu-transliteration"/, \'Urdu keyboard page is missing the canonical Roman Urdu guide promo link\');'
          if old not in s:
              raise SystemExit('Legacy keyboard promo assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repair and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-canonical-test.yml
          git add tests/static.test.js .github/workflows/fix-canonical-test.yml
          git commit -m "test: require canonical Roman Urdu promo URL"
          git push origin HEAD:agent/internal-canonical-link-cleanup
