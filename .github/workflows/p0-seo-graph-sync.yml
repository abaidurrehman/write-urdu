name: P0 SEO graph sync

on:
  push:
    branches:
      - p0-public-product-language-firewall

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-public-product-language-firewall
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Regenerate static SEO graph
        run: node scripts/sync-static-seo-graph.js
      - name: Verify generated SEO graph
        run: npm run seo:graph:check
      - name: Commit generated graph
        run: |
          if git diff --quiet; then
            echo "Static SEO graph already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --all
            git commit -m "Regenerate static SEO graph after language cleanup"
            git push origin HEAD:p0-public-product-language-firewall
          fi
