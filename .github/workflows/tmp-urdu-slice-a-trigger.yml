name: Temporary Slice A trigger

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'feature/urdu-locale-slice-a'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Slice A branch
        uses: actions/checkout@v4
        with:
          ref: feature/urdu-locale-slice-a

      - name: Apply embedded validated patch
        shell: bash
        run: |
          publisher=.github/workflows/tmp-urdu-slice-a-snapshot.yml
          awk '/cat > \/tmp\/slice-a.patch.gz.b64/{capture=1;next} capture && /^[[:space:]]*EOF$/{exit} capture{sub(/^          /,""); print}' "$publisher" > /tmp/slice-a.patch.gz.b64
          base64 -d /tmp/slice-a.patch.gz.b64 | gunzip > /tmp/slice-a.patch.raw
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/slice-a.patch.raw').read_text().splitlines(True)
          sections = []
          current = []
          for line in lines:
              if line.startswith('diff -ruN ') and current:
                  sections.append(current)
                  current = []
              current.append(line)
          if current:
              sections.append(current)
          kept = [section for section in sections if 'tmp-urdu-slice-a-snapshot.yml' not in section[0]]
          Path('/tmp/slice-a.patch').write_text(''.join(''.join(section) for section in kept))
          PY
          patch -p1 --batch < /tmp/slice-a.patch
          node scripts/generate-urdu-locale.js
          awk '/cat > \/tmp\/slice-a-files/{capture=1;next} capture && /^[[:space:]]*EOF$/{exit} capture{sub(/^          /,""); print}' "$publisher" > /tmp/slice-a-files

      - name: Commit exact Slice A manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r file; do git add -- "$file"; done < /tmp/slice-a-files
          git rm -- .github/workflows/tmp-urdu-slice-a-snapshot.yml .github/workflows/tmp-urdu-slice-a-trigger.yml
          git diff --cached --check
          git commit -m "feat: implement Urdu locale foundation"
          git push origin HEAD:feature/urdu-locale-slice-a
