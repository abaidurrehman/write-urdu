name: Temporary SEO shell lifecycle patch

on:
  push:
    branches:
      - agent/p0-2-production-indexing-closure

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-2-production-indexing-closure

      - name: Align homepage H1 and bind metadata to locale lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path

          header_path = Path('site-header.js')
          header = header_path.read_text()
          old_home = "'/' :"  # sentinel only; replacements below use exact text
          replacements = {
              "'/': { title: ['Write Urdu online', 'آن لائن اردو لکھیں']": "'/': { title: ['Type Roman Urdu and convert it to Urdu script', 'آن لائن اردو لکھیں']",
              "'/index.html': { title: ['Write Urdu online', 'آن لائن اردو لکھیں']": "'/index.html': { title: ['Type Roman Urdu and convert it to Urdu script', 'آن لائن اردو لکھیں']",
          }
          for old, new in replacements.items():
              if old not in header:
                  raise SystemExit(f'Missing site-header replacement target: {old}')
              header = header.replace(old, new, 1)
          header_path.write_text(header)

          seo_path = Path('js/seo.js')
          seo = seo_path.read_text()
          old = """    // The shared shell localizes its initial document title on DOMContentLoaded.\n    // Explicit SEO-registry search metadata is the canonical initial-load\n    // search contract, so re-apply it after earlier DOMContentLoaded handlers\n    // finish. Later user-triggered locale changes remain free to localize the UI.\n    function reapplyAfterShell() {\n        window.setTimeout(applyResolvedSearchMetadata, 0);\n    }\n    if (document.readyState === 'loading') {\n        document.addEventListener('DOMContentLoaded', reapplyAfterShell, { once: true });\n    } else {\n        reapplyAfterShell();\n    }\n"""
          new = """    // The shared shell may load after DOMContentLoaded and re-apply page copy.\n    // Its locale-change event fires after that copy has been applied, so use the\n    // semantic lifecycle signal instead of a timing guess. English keeps the\n    // SEO-registry search metadata; an explicitly selected Urdu locale may keep\n    // its localized UI/document title.\n    function restoreSearchMetadataAfterLocale(event) {\n        var locale = event && event.detail && event.detail.locale;\n        if (locale !== 'ur') applyResolvedSearchMetadata();\n    }\n    document.addEventListener('write-urdu:locale-change', restoreSearchMetadataAfterLocale);\n"""
          if old not in seo:
              raise SystemExit('Missing js/seo.js lifecycle block')
          seo_path.write_text(seo.replace(old, new, 1))

          test_path = Path('tests/english-urdu-typing-acquisition-contract.test.js')
          test = test_path.read_text()
          old_test = """assert.match(runtimeSeo, /function applyResolvedSearchMetadata\\(\\)/, 'Runtime SEO must centralize resolved search metadata');\nassert.match(runtimeSeo, /DOMContentLoaded[\\s\\S]*reapplyAfterShell/, 'Runtime SEO must restore registry metadata after shared-shell initialization');\nassert.match(runtimeSeo, /setTimeout\\(applyResolvedSearchMetadata, 0\\)/, 'Registry metadata must be re-applied after earlier DOMContentLoaded handlers');\n"""
          new_test = """assert.match(runtimeSeo, /function applyResolvedSearchMetadata\\(\\)/, 'Runtime SEO must centralize resolved search metadata');\nassert.match(runtimeSeo, /write-urdu:locale-change[\\s\\S]*restoreSearchMetadataAfterLocale/, 'Runtime SEO must restore registry metadata from the shared-shell locale lifecycle');\nassert.match(runtimeSeo, /locale !== ['\"]ur['\"][\\s\\S]*applyResolvedSearchMetadata\\(\\)/, 'English shell applications must restore acquisition metadata without overriding Urdu localization');\n"""
          if old_test not in test:
              raise SystemExit('Missing acquisition lifecycle test block')
          test_path.write_text(test.replace(old_test, new_test, 1))
          PY

      - name: Commit lifecycle fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-header.js js/seo.js tests/english-urdu-typing-acquisition-contract.test.js
          git commit -m "SEO: bind acquisition metadata to shell locale lifecycle"
          git push origin HEAD:agent/p0-2-production-indexing-closure
