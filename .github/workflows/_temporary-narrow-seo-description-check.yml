name: Temporary acquisition description check patch

on:
  push:
    branches:
      - agent/p0-2-production-indexing-closure

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-2-production-indexing-closure
      - name: Narrow strict description equality to acquisition routes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-seo.js')
          text = path.read_text()
          old = "if (description !== expectedDescription) errors.push(`${file}: description does not match resolved registry metadata`);"
          new = "if (page.searchDescription && description !== expectedDescription) errors.push(`${file}: description does not match resolved registry metadata`);"
          if old not in text:
              raise SystemExit('Expected strict description assertion was not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-seo.js
          git commit -m "SEO: keep strict description sync scoped to acquisition routes"
          git push origin HEAD:agent/p0-2-production-indexing-closure
