name: Mobile focus repair helper

on:
  push:
    branches:
      - fix/urdu-editor-locale-sync

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/urdu-editor-locale-sync
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair keyboard-sized Rich Editor focus
        run: node scripts/repair-rich-editor-keyboard-focus.js

      - name: Commit validated repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/mobile-authoring-focus.css sw.js tests
          if git diff --cached --quiet; then
            echo "Mobile focus repair is already applied."
            exit 0
          fi
          git commit -m "fix(mobile): preserve Rich Editor space with keyboard open"
          git push origin HEAD:fix/urdu-editor-locale-sync
