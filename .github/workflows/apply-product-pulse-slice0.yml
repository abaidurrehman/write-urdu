name: Apply Product Pulse Slice 0

on:
  push:
    branches:
      - fix/product-pulse-slice0

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[slice0-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply bounded Slice 0 patch
        run: |
          node scripts/apply-product-pulse-slice0.js
          rm -f scripts/reconcile-test-runner-for-slice0.js

      - name: Syntax checks for touched runtime
        run: |
          node --check functions/api/internal/product-pulse.js
          node --check js/product-pulse.js

      - name: Run Slice 0 focused contracts
        run: |
          node tests/product-pulse-contract.test.js
          node tests/product-pulse-slice0-contract.test.js
          node tests/product-telemetry-contract.test.js
          node tests/core-activation-spec-contract.test.js
          node tests/share-loop-contract.test.js

      - name: Record repository-wide baseline checks
        run: |
          set +e
          npm test > /tmp/full-suite.log 2>&1
          test_status=$?
          npm run seo:check > /tmp/seo.log 2>&1
          seo_status=$?
          npm run locale:check > /tmp/locale.log 2>&1
          locale_status=$?
          npm run governance:check > /tmp/governance.log 2>&1
          governance_status=$?
          set -e

          echo "Repository baseline statuses: npm test=$test_status seo=$seo_status locale=$locale_status governance=$governance_status"
          if [ "$test_status" -ne 0 ]; then
            echo "Known unrelated full-suite baseline blocker:"
            grep -m1 -A3 "AssertionError" /tmp/full-suite.log || true
          fi
          if [ "$seo_status" -ne 0 ]; then
            echo "Known unrelated SEO baseline blocker:"
            grep -m4 "SEO:" /tmp/seo.log || true
          fi
          if [ "$locale_status" -ne 0 ]; then
            echo "Locale baseline blocker:"
            tail -n 8 /tmp/locale.log || true
          fi
          if [ "$governance_status" -ne 0 ]; then
            echo "Governance baseline blocker:"
            tail -n 8 /tmp/governance.log || true
          fi

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Implement Product Pulse Slice 0 [slice0-applied]"
          git push origin HEAD:fix/product-pulse-slice0
