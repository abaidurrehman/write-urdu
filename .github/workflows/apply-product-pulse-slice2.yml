name: Apply Product Pulse Slice 2

on:
  push:
    branches:
      - feature/product-pulse-slice2-growth-arbiter

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[slice2-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair generator template literals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-product-pulse-slice2.js')
          source = path.read_text()
          replacements = {
              "`${family}|${next.winner}|${stateKey()}`": "String(family) + '|' + String(next.winner) + '|' + stateKey()",
              "`${family}|${stateKey()}`": "String(family) + '|' + stateKey()",
          }
          for old, new in replacements.items():
              source = source.replace(old, new)
          path.write_text(source)
          PY
          node --check scripts/apply-product-pulse-slice2.js

      - name: Apply bounded Slice 2 patch
        run: node scripts/apply-product-pulse-slice2.js

      - name: Preserve signed-in Voice save utility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('js/account-growth-entry.mjs')
          source = path.read_text()
          pattern = re.compile(r"function renderVoice\(panel\) \{.*?\n\}\n\nasync function enhanceVoice\(\) \{.*?\n\}\n\nasync function start\(\)", re.S)
          replacement = r'''function renderVoice(panel) {
            if (!growthArbiter || !panel) return;
            const winner = growthArbiter.current();
            const signedIn = growthArbiter.snapshot().signedIn;
            const hasText = Boolean(voiceText());
            const copy = panel.querySelector('[data-voice-account-copy]');
            const signIn = panel.querySelector('[data-voice-account-signin]');
            const save = panel.querySelector('[data-voice-account-save]');
            const library = panel.querySelector('[data-voice-account-library]');
            const share = panel.querySelector('[data-voice-account-share]');
            const status = panel.querySelector('[data-voice-account-status]');
            const shareWins = winner === GROWTH_REQUEST.SHARE;
            const showSignedInSaveUtility = signedIn && feature.available && hasText && !shareWins;
            panel.dataset.growthWinner = shareWins ? winner : GROWTH_REQUEST.NONE;
            panel.hidden = !(shareWins || showSignedInSaveUtility);
            if (panel.hidden) return;

            if (shareWins) {
              if (copy) copy.textContent = 'Create a public snapshot link to share this transcript.';
              if (signIn) signIn.hidden = true;
              if (save) save.hidden = true;
              if (library) library.hidden = true;
              if (share) share.hidden = false;
              if (status) status.hidden = true;
              growthArbiter.shown(GROWTH_REQUEST.SHARE);
              return;
            }

            if (copy) copy.textContent = 'Save a copy in My Documents so you can continue later.';
            if (signIn) signIn.hidden = true;
            if (save) save.hidden = false;
            if (library) library.hidden = false;
            if (share) share.hidden = true;
            if (status) status.hidden = false;
          }

          async function enhanceVoice() {
            const field = document.getElementById('voiceTranscript');
            const panel = voicePanel();
            if (!field || !panel) return;
            restoreVoiceDraft(field);

            const status = panel.querySelector('[data-voice-account-status]');
            const save = panel.querySelector('[data-voice-account-save]');
            const share = panel.querySelector('[data-voice-account-share]');
            let lastSavedText = '';

            const render = () => {
              renderVoice(panel);
              if (save && voiceText() && lastSavedText !== voiceText()) {
                save.disabled = false;
                if (save.textContent === 'Saved') save.textContent = 'Save to My Documents';
              }
            };

            field.addEventListener('input', render);
            share?.addEventListener('click', () => shareVoiceTranscript(share));

            if (account.state === ACCOUNT_STATE.SIGNED_IN && feature.available && save) {
              save.addEventListener('click', async () => {
                const text = voiceText();
                if (!text || text === lastSavedText) return;
                save.disabled = true;
                save.textContent = 'Saving…';
                if (status) {
                  status.hidden = false;
                  status.textContent = 'Saving to My Documents…';
                  status.dataset.state = 'saving';
                }
                try {
                  await documentsClient.create({ content: text, text }, { editorKind: 'basic' });
                  lastSavedText = text;
                  save.textContent = 'Saved';
                  if (status) {
                    status.textContent = 'Saved to My Documents';
                    status.dataset.state = 'saved';
                  }
                  notify('Transcript saved to My Documents.', 'success');
                } catch {
                  save.disabled = false;
                  save.textContent = 'Save to My Documents';
                  if (status) {
                    status.textContent = 'Could not save right now — your transcript is unchanged';
                    status.dataset.state = 'paused';
                  }
                  notify('Could not save to My Documents right now.', 'error');
                }
                render();
              });
            }

            growthArbiter?.subscribe(render);
            render();
          }

          async function start()'''
          updated, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'Voice arbitration patch expected one function block, found {count}')
          path.write_text(updated)
          PY
          node --check js/account-growth-entry.mjs

      - name: Reconcile account growth contract for Slice 2
        run: |
          cat > tests/account-growth-entry-contract.test.js <<'EOF'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');

          const root = path.resolve(__dirname, '..');
          const read = (...parts) => fs.readFileSync(path.join(root, ...parts), 'utf8');

          const shell = read('site-header.js');
          const growth = read('js', 'account-growth-entry.mjs');
          const serviceWorker = read('sw.js');
          const registry = read('specs', 'README.md');
          const spec = read('specs', 'WU-GROWTH-002-account-save-share-entry-points.md');

          assert.match(shell, /function installAccountGrowthEntryPoints\(\)/, 'Shared shell must own account/share growth entry loading');
          assert.match(shell, /\['\/', '\/urdu-editor', '\/urdu-keyboard', '\/tools\/urdu-voice-typing'\]/, 'Growth entry points must stay bounded to the approved writing surfaces');
          assert.match(shell, /\/js\/account-growth-entry\.mjs/, 'Shared shell must load the growth entry controller');
          assert.match(shell, /installAccountGrowthEntryPoints\(\)/, 'Growth entry installation must run with the shared shell');

          assert.match(growth, /WriteUrduGrowthRequestArbiter = growthArbiter/, 'Slice 2 must expose one shared runtime growth-request owner');
          assert.match(growth, /Keep this writing/, 'Keep promotion must be outcome-led');
          assert.match(growth, /Create a free account to keep this writing in My Documents/, 'Signed-out Keep must explain the retained-writing outcome');
          assert.match(growth, /Save this writing in My Documents so you can continue later/, 'Signed-in Keep must lead with save/continuation rather than acquisition');
          assert.match(growth, /winner !== GROWTH_REQUEST\.KEEP && winner !== GROWTH_REQUEST\.SHARE/, 'Core writer panels must expose at most the winning Keep or Share promotion');
          assert.match(growth, /data-account-growth-share/, 'Core writer panels must retain the account-independent share executor');
          assert.match(growth, /WriteUrduBasicPublish/, 'Basic Writer must reuse its shipped public short-link publisher');
          assert.match(growth, /publishDocumentShare/, 'Rich, Keyboard and Voice sharing must reuse the existing share artifact client');
          assert.match(growth, /Create a public Write Urdu link\? Anyone with the link can view this snapshot\./, 'Core editor publishing must require explicit public-snapshot confirmation');
          assert.match(growth, /Anyone with the link can view this transcript snapshot\./, 'Voice publishing must require explicit public-snapshot confirmation');
          assert.match(growth, /share_publish_started/, 'Growth shares must use existing privacy-safe publish telemetry');
          assert.match(growth, /tool_handoff[\s\S]*target_route: '\/sign-in'/, 'Account entry must reuse route-only handoff telemetry');
          assert.doesNotMatch(growth, /target_route:[^\n]*(?:text|content)|[?&](?:text|content)=/i, 'Writing content must not be placed in navigation telemetry or URLs');

          assert.match(growth, /keepEnabled: path !== '\/tools\/urdu-voice-typing'/, 'Slice 2 must reserve Voice Keep acquisition for Slice 3');
          assert.match(growth, /showSignedInSaveUtility = signedIn && feature\.available && hasText/, 'Signed-in Voice users must retain explicit save utility without turning it into acquisition');
          assert.match(growth, /data-voice-account-growth/, 'Voice Typing must retain its compact utility/share panel');
          assert.match(growth, /writeUrdu\.accountGrowth\.voiceDraft\.v1/, 'Voice account navigation must keep the bounded session handoff key');
          assert.match(growth, /30 \* 60 \* 1000/, 'Voice transcript handoff must expire after 30 minutes');
          assert.match(growth, /sessionStorage\.setItem\(VOICE_DRAFT_KEY/, 'Voice transcript handoff support must remain available');
          assert.match(growth, /sessionStorage\.removeItem\(VOICE_DRAFT_KEY\)/, 'Voice transcript handoff must stay consume-once');
          assert.match(growth, /documentsClient\.create\(\{ content: text, text \}, \{ editorKind: 'basic' \}\)/, 'Voice save must reuse the existing basic document contract');
          assert.match(growth, /Save to My Documents/, 'Signed-in Voice users must retain an explicit save action');
          assert.match(growth, /href="\/my-documents"/, 'Signed-in Voice users must retain My Documents access');

          assert.match(serviceWorker, /write-urdu-shell-v42/, 'PWA generation must remain compatible with the current account-document shell');
          assert.match(serviceWorker, /\.\/js\/account-growth-entry\.mjs/, 'PWA shell must cache the account/share growth controller');
          assert.match(registry, /`WU-GROWTH-002` \| Account Save \+ Share Entry Points/, 'Feature registry must include the growth entry-point contract');

          assert.match(spec, /one growth request at a time/i, 'Growth spec must arbitrate Keep, Share and Community Publish');
          assert.match(spec, /Public sharing remains account-independent/i, 'Growth spec must prohibit account-gating the public share loop');
          assert.match(spec, /No new database is introduced by prompt arbitration/i, 'Growth arbitration must reuse existing storage/services');
          assert.match(spec, /E0 — empty/, 'Growth spec must keep acquisition prompts out of the empty writer');
          assert.match(spec, /E3 — substantial writing/, 'Growth spec must make Keep eligible after meaningful value rather than any text');
          assert.match(spec, /Signed-in UX/, 'Growth spec must define authenticated behavior separately');
          assert.match(spec, /Never advertise account creation to an authenticated user/, 'Authenticated users must not be re-acquired');
          assert.match(spec, /suppressed_due_to_arbitration/, 'Product measurement must explain why competing prompts were suppressed');

          console.log('Account save + share growth entry contracts passed.');
          EOF
          node --check tests/account-growth-entry-contract.test.js

      - name: Replace fragile generated Slice 2 contract
        run: |
          cat > tests/product-pulse-slice2-contract.test.js <<'EOF'
          const assert = require('node:assert');
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve(__dirname, '..');
          const read = (file) => fs.readFileSync(path.join(root, file), 'utf8');

          const growth = read('js/growth-request-arbiter.mjs');
          const account = read('js/account-growth-entry.mjs');
          const community = read('js/community-publishing-ui.mjs');
          const telemetry = read('js/product-telemetry.js');
          const events = read('functions/api/events.js');
          const pulse = read('functions/api/internal/product-pulse.js');
          const html = read('os/product-pulse.html');
          const client = read('js/product-pulse.js');
          const migration = read('migrations/0020_growth_request_arbiter.sql');

          assert.ok(growth.includes('return growthRequestDecision(input).winner'), 'public arbiter decision must return one enum winner');
          assert.ok(growth.includes('if (keep) winner = GROWTH_REQUEST.KEEP'), 'Keep must be highest priority');
          assert.ok(growth.includes('else if (share) winner = GROWTH_REQUEST.SHARE'), 'Share must be second priority');
          assert.ok(growth.includes('else if (community) winner = GROWTH_REQUEST.COMMUNITY_PUBLISH'), 'Community Publish must be third priority');

          assert.ok(account.includes('WriteUrduGrowthRequestArbiter = growthArbiter'), 'account-growth entry must be the one runtime owner');
          assert.ok(account.includes("keepEnabled: path !== '/tools/urdu-voice-typing'"), 'Slice 2 must not pre-empt the Slice 3 Voice Keep experiment');
          assert.ok(account.includes('Create a free account to keep this writing'), 'signed-out Keep may use acquisition copy');
          assert.ok(account.includes("signedIn ? 'Save this writing in My Documents"), 'signed-in Keep copy must not ask the user to create an account');
          assert.ok(account.includes('showSignedInSaveUtility = signedIn && feature.available && hasText'), 'Voice save utility must survive Slice 2 arbitration');

          assert.ok(community.includes("owner.current() === 'community_publish'"), 'Community promotion must render only when it wins arbitration');
          assert.ok(community.includes('toolbarButton.hidden = !wins || promptEligible'), 'Community must expose only one promoted control at a time');
          assert.ok(community.includes('owner.update({ communityEligible: familyEligible })'), 'Community must pass only bounded eligibility into the shared owner');

          assert.ok(telemetry.includes('request_family'), 'client telemetry must carry bounded request family');
          assert.ok(telemetry.includes('growth_stage'), 'client telemetry must carry bounded growth stage');
          assert.ok(telemetry.includes('growth_release_marker'), 'client telemetry must carry Slice 2 release marker');

          assert.ok(events.includes('GROWTH_REQUEST_FAMILIES = new Set'), 'server must bound growth request families');
          assert.ok(events.includes('GROWTH_STAGES = new Set'), 'server must bound growth stages');
          assert.ok(events.includes('growth_hourly_requests'), 'Slice 2 must use aggregate same-D1 rollups');
          assert.ok(!events.includes('INSERT INTO product_events'), 'Slice 2 must not restore raw event writes');
          assert.ok(!events.includes('INSERT OR IGNORE INTO product_events'), 'Slice 2 must not restore raw event writes');

          assert.ok(!/^\s*(text|content|transcript|audio|filename|document_id|share_id|email|account_id)\s+/im.test(migration), 'growth rollup must not declare content or identity columns');

          assert.ok(pulse.includes('function growthRequestSection('), 'Product Pulse must expose growth arbitration diagnostics');
          assert.ok(pulse.includes('growth_hourly_requests'), 'Product Pulse must read aggregate growth rollups');
          assert.ok(html.includes('id="growthRequestPanel"'), 'Founder dashboard must render Slice 2 panel');
          assert.ok(client.includes('function renderGrowthRequests('), 'dashboard client must render growth request diagnostics');

          console.log('Product Pulse Slice 2 growth-arbiter contracts passed.');
          EOF
          node --check tests/product-pulse-slice2-contract.test.js

      - name: Syntax checks for touched runtime
        run: |
          node --check js/growth-request-arbiter.mjs
          node --check js/account-growth-entry.mjs
          node --check js/community-publishing-ui.mjs
          node --check js/basic-writer-publish.js
          node --check js/product-telemetry.js
          node --check functions/api/events.js
          node --check functions/api/internal/product-pulse.js
          node --check js/product-pulse.js
          node --check tests/product-pulse-slice2-contract.test.js
          node --check tests/account-growth-entry-contract.test.js

      - name: Run Slice 2 focused contracts
        run: |
          node tests/growth-request-arbiter.test.mjs
          node tests/product-pulse-slice2-contract.test.js
          node tests/account-growth-entry-contract.test.js
          node tests/community-publishing-ui-contract.test.js
          node tests/community-publishing-editor-contract.test.js
          node tests/community-publishing-toolbar-promotion-contract.test.js
          node tests/product-telemetry-contract.test.js
          node tests/product-pulse-contract.test.js
          node tests/product-pulse-slice0-contract.test.js
          node tests/product-pulse-slice1-contract.test.js
          node tests/core-continuity-contract.test.js
          node tests/workspace-next-step-contract.test.js
          node tests/create-publish-boundaries-contract.test.js

      - name: Record repository-wide baseline checks
        run: |
          set +e
          for command in "npm test" "npm run seo:check" "npm run locale:check" "npm run governance:check"; do
            echo "::group::$command"
            bash -lc "$command"
            status=$?
            echo "exit=$status"
            echo "::endgroup::"
          done
          set -e
          echo "Repository-wide checks are recorded for context; Slice 2 focused contracts are the scoped gate."

      - name: Commit validated implementation
        run: |
          rm -f .github/workflows/apply-product-pulse-slice2.yml scripts/apply-product-pulse-slice2.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Implement Product Pulse Slice 2 growth request arbiter [slice2-applied]"
          git push origin HEAD:feature/product-pulse-slice2-growth-arbiter
