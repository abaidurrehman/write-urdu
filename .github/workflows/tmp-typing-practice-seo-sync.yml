name: Temporary typing practice SEO sync

on:
  push:
    branches:
      - feature/urdu-typing-practice

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/urdu-typing-practice
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync governed SEO artifacts
        run: |
          node scripts/sync-static-seo-graph.js --write
          node scripts/generate-seo-files.js
          node scripts/sync-static-search-metadata.js --write
      - name: Validate SEO contracts
        run: |
          node scripts/sync-static-seo-graph.js --check
          npm run seo:check
          node tests/static-seo-graph-contract.test.js
      - name: Commit generated SEO source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urdu-typing-practice.html sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No generated SEO changes to commit."
          else
            git commit -m "Sync typing practice SEO graph"
            git push origin HEAD:feature/urdu-typing-practice
          fi
