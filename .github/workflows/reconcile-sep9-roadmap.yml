name: Reconcile Sep 9 roadmap

on:
  push:
    branches:
      - chore/reconcile-sep9-roadmap

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/reconcile-sep9-roadmap
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Reconcile runtime truth into active specs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # Registry: 001B is shipped, not planned.
          replace_once(
              'specs/README.md',
              '| `WU-JOURNEY-001B` | Roman Urdu Resilience & Code-Switching Benchmark | **Planned benchmark** — fixture corpus covers spelling variants, names/numbers, mixed Latin tokens, passage formatting and recovery before any production transliteration change |',
              '| `WU-JOURNEY-001B` | Roman Urdu Resilience & Code-Switching Benchmark | **Implemented** — B0–B4 shipped 2026-09-09; the 106-fixture benchmark is retained as a regression control and bounded batch protected-token handling improved the scored live baseline from 59.2% to 71.8% with zero fixture regressions; mature per-word typing/suggestions/direct mode remain unchanged |'
          )

          # Detailed 001B contract: preserve the research contract but record actual closeout.
          replace_once(
              'specs/WU-JOURNEY-001B-roman-urdu-resilience-code-switching.md',
              '**Status:** Planned benchmark / production changes gated  ',
              '**Status:** Implemented — B0–B4 shipped 2026-09-09; benchmark retained as a regression control  '
          )
          spec = Path('specs/WU-JOURNEY-001B-roman-urdu-resilience-code-switching.md')
          text = spec.read_text()
          anchor = '---\n\n## 1. Objective'
          closeout = '''---\n\n## 2026-09-09 implementation closeout\n\nThe bounded benchmark-to-production sequence is complete:\n\n- **B0/B1:** 106 authored public-safe fixtures plus deterministic scoring/contract coverage were added.\n- **B2:** the live Google Input Tools baseline produced **61 pass / 42 fail / 3 manual / 0 error**, or **59.2%** across 103 scored fixtures. This aggregate intentionally overweights difficult mixed/protected-token cases and must not be presented as general WriteUrdu transliteration accuracy.\n- **B3:** a conservative protected-token transform was implemented only for explicit batch/passage conversion. It preserves high-confidence URL, email, @handle, numeric-shape, short ALL-CAPS acronym and internally mixed-case spans before provider transliteration and then reassembles them without changing line structure.\n- **B4:** the same 106-fixture live benchmark against production behaviour reached **74/103 = 71.8%**, a **+12.6 percentage-point** improvement over B2, with **13 recovered cases and zero fixture regressions**. Code-switching gained 11 passes and long-paste gained 2.\n\nProduction boundaries remain unchanged for mature interactive per-word typing, Space/Backspace behaviour, suggestions, direct Urdu mode, provider choice, analytics and content telemetry. A future Roman spelling-alias experiment is a separate evidence-gated follow-up, not unfinished work in this slice.\n\nEvidence:\n\n- [`../benchmarks/roman-urdu/results/2026-09-09-google-input-tools-baseline.md`](../benchmarks/roman-urdu/results/2026-09-09-google-input-tools-baseline.md)\n- [`../benchmarks/roman-urdu/results/2026-09-09-protected-token-b3.md`](../benchmarks/roman-urdu/results/2026-09-09-protected-token-b3.md)\n- [`../benchmarks/roman-urdu/results/2026-09-09-production-b4.md`](../benchmarks/roman-urdu/results/2026-09-09-production-b4.md)\n\n---\n\n## 1. Objective'''
          if anchor not in text:
              raise SystemExit('001B closeout insertion anchor missing')
          spec.write_text(text.replace(anchor, closeout, 1))

          backlog = Path('specs/BACKLOG.md')
          text = backlog.read_text()
          text = text.replace('**Last reconciled against code + Product Pulse/GSC evidence:** 2026-09-04  ', '**Last reconciled against code + Product Pulse/GSC evidence:** 2026-09-09  ', 1)
          old_state = '**State:** M2 Basic Writer first-viewport implementation shipped 2026-09-03; M3 focus/keyboard + M4 Rich Editor hierarchy shipped 2026-09-04. Remaining work is evidence closeout, real-device/manual validation and `/urdu-keyboard` audit — not another speculative redesign.'
          new_state = '**State:** M2 Basic Writer first-viewport implementation shipped 2026-09-03; M3 focus/keyboard + M4 Rich Editor hierarchy shipped 2026-09-04. A reproduced 375x667 visibility regression was repaired on 2026-09-09 and the full focused browser matrix passed; medium-laptop task-first fold acceptance was also repaired under the existing V3 visual-quality gate. Remaining work is post-release evidence and real-device/manual closeout — not another speculative redesign.'
          if old_state not in text:
              raise SystemExit('P0.1B2 state anchor missing')
          text = text.replace(old_state, new_state, 1)

          old_d = '''- [ ] One growth request at a time: Keep vs Share vs Publish.\n- [ ] Substantial unsaved writing normally prioritizes `Keep this writing`.\n- [ ] Normal task commands remain available without signup.\n- [ ] Signed-in users never see account-acquisition copy.\n- [ ] Distinguish `Share link` from `Publish to Urdu Writers`.\n- [ ] Community publishing appears only when eligible/appropriate and not stacked with a higher-priority request.'''
          new_d = '''**State:** Shared runtime arbitration and Product Pulse diagnostics shipped 2026-09-06 and were reconciled against runtime/tests on 2026-09-09. The remaining growth decision is post-change evidence, not another competing prompt layer.\n\n- [x] One growth request at a time: Keep vs Share vs Publish.\n- [x] Substantial unsaved writing normally prioritizes `Keep this writing`.\n- [x] Normal task commands remain available without signup.\n- [x] Signed-in users never see account-acquisition copy.\n- [x] Distinguish `Share link` from `Publish to Urdu Writers`.\n- [x] Community publishing appears only when eligible/appropriate and not stacked with a higher-priority request.'''
          if old_d not in text:
              raise SystemExit('P0.1D checklist anchor missing')
          text = text.replace(old_d, new_d, 1)

          old_e = '''### P0.1E — Share/referral continuity\n\n- [ ] Trace reader CTA → destination response → referral/handoff recognized → workspace ready → first creation input → meaningful start.'''
          new_e = '''### P0.1E — Share/referral continuity\n\n**State:** Transport, aggregate counters and Product Pulse stages are shipped; explicit reader-to-destination browser acceptance is still open and remains the next P0 acceptance slice.\n\n- [ ] Trace reader CTA → destination response → referral/handoff recognized → workspace ready → first creation input → meaningful start.'''
          if old_e not in text:
              raise SystemExit('P0.1E state anchor missing')
          text = text.replace(old_e, new_e, 1)

          text = text.replace('- [ ] Instrument visit → role/preset → content → canvas edit → export attempt → export complete.', '- [x] Instrument visit → role/preset → content → canvas edit → export attempt → export complete.', 1)
          old_f = '''### P0.1F — Card Studio completion\n\n- [x] Instrument'''
          new_f = '''### P0.1F — Card Studio completion\n\n**State:** Completion funnel instrumentation is shipped in Product Pulse; diagnosis and any Quick-path experiment remain open. Acquisition expansion stays blocked until the completion evidence is understood.\n\n- [x] Instrument'''
          if old_f not in text:
              raise SystemExit('P0.1F state insertion anchor missing')
          text = text.replace(old_f, new_f, 1)
          backlog.write_text(text)
          PY
      - name: Validate governance + contracts
        run: |
          npm run governance:check
          npm test
      - name: Keep final branch diff to spec files only
        run: |
          rm .github/workflows/reconcile-sep9-roadmap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/README.md specs/BACKLOG.md specs/WU-JOURNEY-001B-roman-urdu-resilience-code-switching.md .github/workflows/reconcile-sep9-roadmap.yml
          git commit -m "Reconcile Sep 9 roadmap with shipped runtime"
          git push origin HEAD:chore/reconcile-sep9-roadmap
