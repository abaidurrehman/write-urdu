name: One-time Actions artifact cleanup

on:
  push:
    branches:
      - maintenance/actions-storage-cleanup-20261017

permissions:
  contents: read
  actions: write

jobs:
  clean-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove redundant old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import urllib.request

          root = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(url, method="GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  if method == "DELETE":
                      return None
                  return json.load(response)

          artifacts = []
          page = 1
          while True:
              batch = request(f"{root}/actions/artifacts?per_page=100&page={page}")["artifacts"]
              artifacts.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          cutoff = dt.datetime.now(dt.timezone.utc) - dt.timedelta(hours=24)
          latest_seen = set()
          removed = []
          kept = []
          for a in sorted(artifacts, key=lambda x: x["created_at"], reverse=True):
              name = a["name"]
              category = re.sub(r"[-_]\d{7,}$", "", name)
              created = dt.datetime.fromisoformat(a["created_at"].replace("Z", "+00:00"))
              protected = (category not in latest_seen or created >= cutoff or
                           name.lower().startswith(("release", "package", "distribution")))
              latest_seen.add(category)
              if protected:
                  kept.append(a)
              else:
                  request(f"{root}/actions/artifacts/{a['id']}", "DELETE")
                  removed.append(a)
                  print(f"Deleted artifact {a['id']}: {name}, {a['size_in_bytes']} bytes")

          def mib(items):
              return round(sum(a["size_in_bytes"] for a in items) / 1048576, 1)

          summary = (
              f"Actions artifact cleanup: deleted {len(removed)} artifacts "
              f"({mib(removed)} MiB); kept {len(kept)} ({mib(kept)} MiB). "
              "Kept the newest artifact of each kind and everything from the last 24 hours."
          )
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Artifact cleanup\n\n" + summary + "\n")
          PY
