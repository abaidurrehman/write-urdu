name: Internal canonical link migration

on:
  push:
    branches:
      - agent/internal-canonical-link-cleanup
    paths:
      - '.github/workflows/internal-link-canonicalization.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/internal-canonical-link-cleanup
          fetch-depth: 0

      - name: Normalize crawlable internal anchors
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const config = require('./seo.config.js');

          const root = process.cwd();
          const canonical = new URL(config.SITE_ORIGIN);
          const allowedHosts = new Set([canonical.hostname, canonical.hostname.startsWith('www.') ? canonical.hostname.slice(4) : `www.${canonical.hostname}`]);
          const pathMap = new Map();

          for (const page of config.pages) {
            pathMap.set(page.path, page.path);
            if (page.path !== '/') pathMap.set(`${page.path}/`, page.path);
            for (const legacy of page.legacyPaths || []) pathMap.set(legacy, page.path);
          }
          pathMap.set('/index.html', '/');

          let changedFiles = 0;
          let changedLinks = 0;
          const details = [];

          for (const file of fs.readdirSync(root).filter(name => name.endsWith('.html') && !name.startsWith('google'))) {
            const full = path.join(root, file);
            const before = fs.readFileSync(full, 'utf8');
            let fileChanges = 0;
            const after = before.replace(/<a\b[^>]*\bhref=(['"])([^'"]+)\1/gi, (tag, quote, href) => {
              const trimmed = href.trim();
              if (!trimmed || trimmed.startsWith('#') || /^(mailto:|tel:|javascript:|data:)/i.test(trimmed)) return tag;

              let url;
              try { url = new URL(trimmed, `${config.SITE_ORIGIN}/`); }
              catch (_) { return tag; }

              if (/^https?:\/\//i.test(trimmed) && !allowedHosts.has(url.hostname)) return tag;
              if (trimmed.startsWith('//') && !allowedHosts.has(url.hostname)) return tag;

              const targetPath = pathMap.get(url.pathname);
              if (!targetPath) return tag;

              const replacement = `${targetPath}${url.search}${url.hash}`;
              if (replacement === trimmed) return tag;
              fileChanges += 1;
              changedLinks += 1;
              return tag.replace(`${quote}${href}${quote}`, `${quote}${replacement}${quote}`);
            });

            if (after !== before) {
              fs.writeFileSync(full, after);
              changedFiles += 1;
              details.push(`${file}: ${fileChanges}`);
            }
          }

          console.log(`Normalized ${changedLinks} internal anchors across ${changedFiles} HTML files.`);
          details.forEach(line => console.log(line));
          NODE

      - name: Verify canonical link backlog is gone
        run: npm run governance:check

      - name: Commit migration and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/internal-link-canonicalization.yml
          git add -- '*.html' .github/workflows/internal-link-canonicalization.yml
          if git diff --cached --quiet; then
            echo "No internal-link changes found"
            exit 1
          fi
          git commit -m "seo: point internal links directly at canonical routes"
          git push origin HEAD:agent/internal-canonical-link-cleanup
