name: Temporary static search metadata sync

on:
  push:
    branches:
      - agent/p0-2-production-indexing-closure

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-2-production-indexing-closure

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize initial search metadata
        run: npm run seo:sync-heads

      - name: Commit generated HTML when needed
        run: |
          if git diff --quiet -- index.html urdu-card-studio.html; then
            echo "Static acquisition metadata is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html urdu-card-studio.html
          git commit -m "SEO: sync initial acquisition metadata"
          git push origin HEAD:agent/p0-2-production-indexing-closure
