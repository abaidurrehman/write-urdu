name: Temporary Slice A publisher

on:
  push:
    branches:
      - feature/urdu-locale-slice-a

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Slice A branch
        uses: actions/checkout@v4
        with:
          ref: feature/urdu-locale-slice-a

      - name: Apply validated Slice A source patch
        shell: bash
        run: |
          cat > /tmp/slice-a.patch.gz.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/slice-a.patch.gz.b64 | gunzip > /tmp/slice-a.patch
          patch -p1 --batch < /tmp/slice-a.patch
          node scripts/generate-urdu-locale.js

      - name: Commit only Slice A files and remove publisher
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > /tmp/slice-a-files <<'EOF'
          urdu-keyboard.html
          site-header.js
          _redirects
          playwright.config.js
          urdu-card-studio.html
          package.json
          urdu-editor.html
          index.html
          sw.js
          urdu-alphabet.html
          urdu-faq.html
          how-to-write-urdu-on-photo.html
          locale.config.js
          tools/urdu-voice-typing.html
          locale/ur.js
          tests/urdu-voice-typing-contract.test.js
          tests/urdu-locale.spec.js
          tests/urdu-locale-generated-contract.test.js
          tests/static-regression-core.test.js
          tests/server.js
          tests/urdu-locale-route-contract.test.js
          tests/english-urdu-typing-acquisition-contract.test.js
          scripts/run-contract-tests.js
          scripts/generate-urdu-locale.js
          scripts/dev-server.js
          urdu/urdu-keyboard.html
          urdu/urdu-card-studio.html
          urdu/urdu-editor.html
          urdu/index.html
          urdu/urdu-alphabet.html
          urdu/urdu-faq.html
          urdu/how-to-write-urdu-on-photo.html
          js/core-continuity.js
          js/v2-shell.js
          js/account-growth-entry.mjs
          js/card-studio-entry.js
          js/seo.js
          js/content-locale.js
          js/site-runtime.js
          js/card-studio-ui.js
          js/ads.js
          js/acquisition-telemetry.js
          js/product-telemetry.js
          js/site-header-core.js
          js/write-monetization.js
          js/card-studio-handoff-adapter.js
          js/workspace-next-step.js
          js/template-library.js
          js/product-telemetry-integrations.js
          js/basic-account-documents.mjs
          js/qr-handoff-adapter.js
          js/outcome-navigation.js
          js/locale-route.js
          js/input-mode.js
          js/editor-account-documents.mjs
          js/core-workspace-convergence.js
          urdu/tools/urdu-voice-typing.html
          .github/workflows/quality.yml
          EOF
          while IFS= read -r file; do git add -- "$file"; done < /tmp/slice-a-files
          git rm -- .github/workflows/tmp-urdu-slice-a-snapshot.yml
          git diff --cached --check
          git commit -m "feat: implement Urdu locale foundation"
          git push origin HEAD:feature/urdu-locale-slice-a
