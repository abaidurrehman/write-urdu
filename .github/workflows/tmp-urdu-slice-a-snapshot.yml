name: Temporary Slice A snapshot

on:
  push:
    branches:
      - feature/urdu-locale-slice-a

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: write-urdu-slice-a-snapshot-${{ github.run_id }}
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
