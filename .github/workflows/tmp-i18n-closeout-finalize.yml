name: Temporary i18n closeout finalizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feature/wu-i18n-001c-closeout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wu-i18n-001c-closeout
          fetch-depth: 0
      - name: Apply verified closeout patch
        shell: bash
        run: |
          cat .tmp/i18n-closeout-*.b64 > /tmp/i18n-closeout.patch.gz.b64
          base64 -d /tmp/i18n-closeout.patch.gz.b64 | gzip -dc > /tmp/i18n-closeout.patch
          git apply --check /tmp/i18n-closeout.patch
          git apply /tmp/i18n-closeout.patch
          node scripts/generate-urdu-locale.js
          node tests/static.test.js
          node tests/urdu-locale-closeout-contract.test.js
          node tests/product-telemetry-contract.test.js
          node tests/acquisition-revenue-contract.test.js
          node tests/product-pulse-contract.test.js
          node scripts/generate-urdu-locale.js --check
          node scripts/check-urdu-locale-seo.js
          node scripts/check-product-governance.js
      - name: Commit final tree
        shell: bash
        run: |
          rm -rf .tmp
          rm -f .github/workflows/tmp-i18n-closeout-finalize.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "WU-I18N-001C: close Phase 1 Urdu launch gaps"
          git push origin HEAD:feature/wu-i18n-001c-closeout
